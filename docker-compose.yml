version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./.mempalace_data:/app/.mempalace_data
      - ./.wiki_data:/app/.wiki_data
      - /tmp/gitnexus_repos:/app/gitnexus_repos
    environment:
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Hardware-tuned for RTX 3090 + Ryzen 9 5950X
      - UVICORN_WORKERS=16
      - OMP_NUM_THREADS=32
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
        limits:
          memory: 32G
        reservations:
          memory: 8G
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
